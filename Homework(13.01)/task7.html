<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flashcard</title>
  <link rel="stylesheet" href="task7.css">
</head>
<body>

<div class="app">

  <div class="header">
    <div class="logo">Flashcard</div>
    <div class="tabs">
      <div class="tab active">Study Mode</div>
      <div class="tab">All Cards</div>
    </div>
  </div>

  <div class="main">

    <div class="left">

      <div class="filters">
        <div class="select">All Categories</div>
        <div class="checkbox">Hide Mastered</div>
        <div class="btn">Shuffle</div>
      </div>

      <div class="card">
        <div class="tag">Web Development</div>
        <div class="question">What does HTML stand for?</div>
        <div class="hint">Click to reveal answer</div>

        <div class="progress">
          <div class="bar"></div>
          <div class="count">0/5</div>
        </div>
      </div>

      <div class="actions">
        <div class="btn yellow">I Know This</div>
        <div class="btn">Reset Progress</div>
      </div>

      <div class="nav">
        <div class="btn">Previous</div>
        <div class="page">Card 1 of 40</div>
        <div class="btn">Next</div>
      </div>

    </div>

    <div class="right">
      <div class="stats-title">Study Statistics</div>

      <div class="stat blue">
        <div class="stat-text">
          <div>Total Cards</div>
          <div class="num">40</div>
        </div>
      </div>

      <div class="stat green">
        <div class="stat-text">
          <div>Mastered</div>
          <div class="num">11</div>
        </div>
      </div>

      <div class="stat pink">
        <div class="stat-text">
          <div>In Progress</div>
          <div class="num">21</div>
        </div>
      </div>

      <div class="stat purple">
        <div class="stat-text">
          <div>Not Started</div>
          <div class="num">8</div>
        </div>
      </div>

    </div>

  </div>

</div>

</body>
</html>
