<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>document</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="calc">
    <div class="display">
      <div class="mini" id="mini"></div>
      <div class="screen" id="screen">0</div>
    </div>
    <div class="keys" id="keys">
      <button class="btn fn span-2" id="C">C</button>
      <button class="btn fn" id="BACK">←</button>
      <button class="btn op" id="DIV">÷</button>

      <button class="btn" id="7">7</button>
      <button class="btn" id="8">8</button>
      <button class="btn" id="9">9</button>
      <button class="btn op" id="MUL">×</button>

      <button class="btn" id="4">4</button>
      <button class="btn" id="5">5</button>
      <button class="btn" id="6">6</button>
      <button class="btn op" id="SUB">−</button>

      <button class="btn" id="1">1</button>
      <button class="btn" id="2">2</button>
      <button class="btn" id="3">3</button>
      <button class="btn op" id="ADD">+</button>

      <button class="btn span-3" id="0">0</button>
      <button class="btn op" id="EQ">=</button>
   <script src="script.js"></script>
    </div>
  </div>
</body>
</html>
