<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="top">
    <img class="logoImg" src="logo.svg" alt="logo">

    <div class="menu">
      <p class="p1">Collections</p>
        <p class="p1">Men</p>
            <p class="p1">Woman</p>
                <p class="p1">About</p>
                    <p class="p1">Contact</p>
                        </div>

    <div class="rightTop">
      <img class="cartTop" src="icon-cart.svg" alt="cart">
        <img class="avatar" src="image-avatar.png" alt="avatar">
            </div>
  </div>

  <div class="MainContainer">
    <div class="left">
      <div class="big-photo">
        <img src="image-product-1.jpg" alt="Main product">
            </div>

      <div class="thumbs">
        <div class="thumb active"><img src="image-product-1-thumbnail.jpg" alt=""></div>
            <div class="thumb"><img src="image-product-2-thumbnail.jpg" alt=""></div>
                <div class="thumb"><img src="image-product-3-thumbnail.jpg" alt=""></div>
                    <div class="thumb"><img src="image-product-4-thumbnail.jpg" alt=""></div>
                        </div>
    </div>

    <div class="Description">
        <p class="company">SNEAKER COMPANY</p>
            <h1 class="title">Fall Limited Edition Sneakers</h1>
                <p class="desc">
                    These low-profile sneakers are your perfect casual wear companion.
                        Featuring a durable rubber outer sole, they’ll withstand everything the weather can offer.
                            </p>

      <div class="priceRow">
        <div class="priceNow">$125.00</div>
            <div class="badge">50%</div>
                </div>
                    <div class="priceOld">$250.00</div>
                        <div class="buyRow">
                            <div class="comment qty">
    <button class="minus" type="button">-</button>
        <span class="score">0</span>
            <button class="plus" type="button">+</button>
                            </div>

        <button class="add" type="button">
          <img class="cartBtn" src="icon-cart.svg" alt="cart">
            <p>Add to cart</p>
                </button>
                    </div>
                        </div>
            </div>

                                    <script src="script.js"></script>
</body>
</html>
