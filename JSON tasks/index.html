<!--DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Students</title>

<style>
body {
  font-family: Arial;
  background: radial-gradient(circle at top, rgb(20,30,70), rgb(5,5,20));
  padding: 40px;
  color: rgb(230,230,255);
}
h2 {
  text-align: center;
  color: white;
  text-shadow: 0 0 15px rgb(255,200,50);
}
.row {
  background: rgba(20,40,120,0.6);
  border: 1px solid rgb(255,200,80);
  padding: 20px;
  border-radius: 16px;
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
}
input {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid rgb(120,160,255);
  background: rgb(10,20,60);
  color: white;
}
button {
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(rgb(255,210,80), rgb(255,140,0));
  font-weight: bold;
  cursor: pointer;
}
ul {
  list-style: none;
  padding: 0;
  max-width: 450px;
  margin: auto;
}
li {
  background: rgba(20,40,120,0.7);
  border-left: 4px solid rgb(255,200,80);
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
}
li button {
  background: rgb(220,60,60);
  color: white;
  padding: 6px 10px;
}
</style>
</head>

<body>

<h2>Students</h2>

<div class="row">
  <input id="nameInput" placeholder="Name">
  <input id="ageInput" type="number" placeholder="Age">
  <button id="addBtn">Add</button>
</div>

<div class="row">
  <input id="searchInput" placeholder=" Search by name">
</div>

<ul id="list"></ul>

<script>
let students = [];

const nameInput = document.querySelector("#nameInput");
const ageInput = document.querySelector("#ageInput");
const addBtn = document.querySelector("#addBtn");
const list = document.querySelector("#list");
const searchInput = document.querySelector("#searchInput");

function save() {
  localStorage.setItem("students", JSON.stringify(students));
}

function load() {
  const data = localStorage.getItem("students");
  if (data) students = JSON.parse(data);
}

function render() {
  list.innerHTML = "";

  const search = searchInput.value.toLowerCase();

  students
    .filter(s => s.name.toLowerCase().includes(search))
    .forEach((student, index) => {
      const li = document.createElement("li");
      li.textContent = `${student.name} — ${student.age}`;

      const btn = document.createElement("button");
      btn.textContent = "Delete" ;

      btn.onclick = () => {
        students.splice(index, 1);
        save();
        render();
      };

      li.appendChild(btn);
      list.appendChild(li);
    });
}

function addStudent() {
  const name = nameInput.value.trim();
  const age = Number(ageInput.value);

  if (!name || !age) return;

  students.push({ name, age });
  save();
  render();

  nameInput.value = "";
  ageInput.value = "";
}

addBtn.onclick = addStudent;
searchInput.oninput = render;

load();
render();
</script>

</body>
</html>-->

        { name: "Dana", age: 22, city: "Almaty" },

        { name: "Amina", age: 25, city: "Astana" }
    ];

    const button = document.getElementById("btn");
    const input = document.getElementById("minAge");
    const output = document.getElementById("out");

    button.addEventListener("click", () => {
        const minAge = Number(input.value);

        const filtered = data.filter(user => user.age > minAge);

        output.innerHTML = "";

        if (filtered.length === 0) {

                <span class="muted">(${user.city})</span>
            `;

        });
