<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="bg-blur bg1"></div>
  <div class="bg-blur bg2"></div>

  <header class="header">
    <div>
      <h1>📚 Study Planner</h1>
      <p class="subtitle">Plan smarter. Study better.</p>
    </div>
    <button id="darkModeBtn" class="ghost-btn">🌙 Dark Mode</button>
  </header>

  <main class="main">
    <section class="panel input-panel">
      <div class="input-row">
        <div class="field task-field">
          <input type="text" id="taskInput" placeholder="Enter your study task..." maxlength="50" />
          <span id="charCount">0 / 50</span>
        </div>

        <button id="addBtn">Add Task</button>
        <button id="clearAllBtn" class="danger-btn">Clear All</button>
      </div>

      <div class="input-row second-row">
        <select id="sortSelect">
          <option value="default">Sort By</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="liked">Liked First ❤️</option>
        </select>

        <input type="text" id="searchInput" placeholder="Search tasks..." />
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-card"><span>Total</span><strong id="totalCount">0</strong></div>
      <div class="stat-card"><span>Done</span><strong id="doneCount">0</strong></div>
      <div class="stat-card"><span>Left</span><strong id="leftCount">0</strong></div>
    </section>

    <section id="taskContainer" class="task-container"></section>
  </main>

  <footer class="footer">
    <p>© 2026 Study Planner | Made by Adilet</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
