<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
      background-color: rgb(246, 145, 145);
      border-radius: 10px;
      box-shadow: 1px 1px;
    }
    h2{
        color: rgb(7, 7, 122);
        font-size: 20px;
    }
    #userList p {
      margin: 6px 0;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h2>Task 10. Show Only User Names</h2>
  <button id="loadUsersBtn">Load User Names</button>
  <div id="userList"></div>
  <script>
    const button = document.getElementById("loadUsersBtn");
    const userList = document.getElementById("userList");

    button.addEventListener("click", () => {
      userList.innerHTML = "";

      fetch("https://jsonplaceholder.typicode.com/users")
        .then(response => response.json())
        .then(users => {
          users.forEach(user => {
            console.log(user.name);

            const p = document.createElement("p");
            p.textContent = user.name;
            userList.appendChild(p);
          });
        })
        .catch(error => {
          console.log("Error:", error);
          userList.textContent = "Failed to load users.";
        });
    });
  </script>

</body>
</html>
