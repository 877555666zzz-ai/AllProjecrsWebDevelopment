<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="wrap">
    <div class="top">
      <h1 class="logo">devfinder</h1>
        <button class="themeBtn" id="themeBtn" type="button">
            <span id="themeText">LIGHT</span>
                <img id="themeImg" class="themeImg" src="sun.png" alt="theme">
                    </button>
    </div>
      <div class="search">
        <img class="searchIcon" src="search-interface-symbol.png" alt="search">
            <input class="searchInput" type="text" placeholder="Search GitHub username..." />
                <button class="searchBtn" type="button">Search</button>
      </div>

      <div class="card">
        <div class="row">
          <img class="avatar" alt="avatar" src="https://avatars.githubusercontent.com/u/583231?v=4" />
            <div class="main">
                <div class="head">
                    <div>
                        <h2 class="name">The Octocat</h2>
                            <p class="handle">@octocat</p>
                    </div>
                                <p class="joined">Joined 25 Jan 2011</p>
                            </div>

        <p class="bio">This profile has no bio</p>
            <div class="stats">
                <div class="stat">
                    <p class="statLabel">Repos</p>
                        <p class="statValue">8</p>
                            </div>

              <div class="stat">
                    <p class="statLabel">Followers</p>
                        <p class="statValue">3938</p>
                            </div>
              <div class="stat">
                    <p class="statLabel">Following</p>
                        <p class="statValue">9</p>
                             </div>
                                </div>

            <div class="grid">
                <div class="info">
                    <img class="infoIcon" src="location.png" alt="">
                        <p class="infoText">San Francisco</p>
                            </div>

              <div class="info na">
                    <img class="infoIcon" src="twitter.png" alt="">
                        <p class="infoText">Not Available</p>
                             </div>

              <div class="info">
                    <img class="infoIcon" src="link.png" alt="">
                        <p class="infoText">https://github.blog</p>
                            </div>

              <div class="info">
                    <img class="infoIcon" src="github.png" alt="">
                        <p class="infoText">@github</p>
                            </div>
            </div>

          </div>
        </div>
      </div>
</body>
</html>
